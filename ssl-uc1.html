
<html>
  <head>
    <title>Line Chart JS</title>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-base.min.js"></script>
    <style type="text/css">      
      html, body, #container { 
        width: 100%; height: 100%; margin: 0; padding: 0; 
      } 
    </style>
  </head>
  <body>
<div id='container'></div>
    <script>
      anychart.onDocumentReady(function () {  
        // add data
var data = [["13/04/2024-00:11:51", "1089.00", "1089.00", "1089.00", "1089.00", "1089.00"], ["13/04/2024-06:12:36", "1089.00", "1089.00", "1089.00", "1089.00", "1089.00"], ["13/04/2024-12:13:27", "1089.00", "1089.00", "1089.00", "1089.00", "1089.00"], ["13/04/2024-18:14:13", "1089.00", "1089.00", "1089.00", "1089.00", "1089.00"]];

// create a data set
var dataSet = anychart.data.set(data);

// map the data for all series
var economikData = dataSet.mapAs({x: 0, value: 1});
var avshopData = dataSet.mapAs({x: 0, value: 2});
var redoneData = dataSet.mapAs({x: 0, value: 3});
var mcquadeData = dataSet.mapAs({x: 0, value: 4});
var tomleeData = dataSet.mapAs({x: 0, value: 5});

    // create a line chart
        var chart = anychart.line();

        // create the series and name them
        var economik = chart.line(economikData);
economik.name('economik');
var avshop = chart.line(avshopData);
avshop.name('avshop');
var redone = chart.line(redoneData);
redone.name('redone');
var mcquade = chart.line(mcquadeData);
mcquade.name('mcquade');
var tomlee = chart.line(tomleeData);
tomlee.name('tomlee');

    // add a legend
        chart.legend().enabled(true);
  
        // add a title
        chart.title("ssl-uc1");

        // specify where to display the chart
        chart.container("container");
  
        // draw the resulting chart
        chart.draw();
  
      });
    </script>
  </body>
</html>

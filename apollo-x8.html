
<html>
  <head>
    <title>Line Chart JS</title>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-base.min.js"></script>
    <style type="text/css">      
      html, body, #container { 
        width: 100%; height: 100%; margin: 0; padding: 0; 
      } 
    </style>
  </head>
  <body>
<div id='container'></div>
    <script>
      anychart.onDocumentReady(function () {  
        // add data
var data = [["13/04/2024-00:11:51", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["13/04/2024-06:12:36", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["13/04/2024-12:13:27", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["13/04/2024-18:14:13", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["14/04/2024-00:15:02", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["14/04/2024-06:15:47", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["14/04/2024-12:16:30", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["14/04/2024-18:17:21", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["15/04/2024-00:18:10", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["15/04/2024-06:18:56", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"], ["15/04/2024-12:19:48", "4349.00", "3799.00", "4349.00", "4349.00", "4349.00"]];

// create a data set
var dataSet = anychart.data.set(data);

// map the data for all series
var redoneData = dataSet.mapAs({x: 0, value: 1});
var musiccityData = dataSet.mapAs({x: 0, value: 2});
var moogData = dataSet.mapAs({x: 0, value: 3});
var economikData = dataSet.mapAs({x: 0, value: 4});
var mcquadeData = dataSet.mapAs({x: 0, value: 5});

    // create a line chart
        var chart = anychart.line();

        // create the series and name them
        var redone = chart.line(redoneData);
redone.name('redone');
var musiccity = chart.line(musiccityData);
musiccity.name('musiccity');
var moog = chart.line(moogData);
moog.name('moog');
var economik = chart.line(economikData);
economik.name('economik');
var mcquade = chart.line(mcquadeData);
mcquade.name('mcquade');

    // add a legend
        chart.legend().enabled(true);
  
        // add a title
        chart.title("apollo-x8");

        // specify where to display the chart
        chart.container("container");
  
        // draw the resulting chart
        chart.draw();
  
      });
    </script>
  </body>
</html>
